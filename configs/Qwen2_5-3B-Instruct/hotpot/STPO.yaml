# Model arguments
model_name_or_path: /mnt/dolphinfs/hdd_pool/docker/user/hadoop-hmart-poistar/fanghaotian/ckpt/base_model/Qwen2.5-3B-Instruct
run_name: "STPO-hotpot-Qwen2.5-3B-Instruct"
output_dir: /mnt/dolphinfs/hdd_pool/docker/user/hadoop-hmart-poistar/fanghaotian/ckpt/RLCR/STPO-hotpot-Qwen2_5-3B-Instruct
model_revision: main
torch_dtype: bfloat16
attn_implementation: flash_attention_2

# Data training arguments
dataset_name: /mnt/dolphinfs/hdd_pool/docker/user/hadoop-hmart-poistar/fanghaotian/huggingface/mehuldamani/hotpot_qa
# Num processes is less by 1 as vLLM is using 1 GPU
num_processes: 1

# STPO script options (answer selection)
answer_selection_format_pattern: "ta"
answer_selection_strategy: "random"
answer_selection_balanced_correct_fraction: 0.5
answer_selection_reward_funcs:
- accuracy
- format_answer_segment
answer_selection_reward_weights: [1.0, 0.1]

# STPO script options (training rewards)
# - Round-1 (answer-only): only updates answer tokens
answer_reward_funcs:
- accuracy
- format_answer_segment
answer_reward_weights: [1.0, 0.1]

# - Round-2 (answer+confidence): only updates confidence tokens
confidence_reward_funcs:
- format_confidence_segment
- brier
confidence_reward_weights: [0.5, 0.5]

# - Metrics-only (logged, not trained)
metric_reward_funcs:
- mean_confidence
- confidence_one_or_zero

# STPO trainer config
bf16: true
beta: 0.0
eval_strategy: "steps"
eval_steps: 50
eval_on_start: false
format_pattern: "tabc"
gradient_accumulation_steps: 64
gradient_checkpointing: true
gradient_checkpointing_kwargs:
  use_reentrant: false
hub_strategy: "end"
learning_rate: 1e-06
log_level: info
logging_steps: 5
logging_strategy: steps
completion_logging_steps: 1
lr_scheduler_type: constant_with_warmup
max_prompt_length: 3072
max_answer_length: 768
max_confidence_length: 768
max_steps: -1
num_answer_candidates: 32
num_answer_selected: 8
num_iterations: 1
num_train_epochs: 1
overwrite_output_dir: true
per_device_eval_batch_size: 32
per_device_train_batch_size: 8
push_to_hub: false
report_to:
- wandb
save_strategy: "steps"
save_steps: 60
save_total_limit: 1
save_only_model: true
scale_rewards: false
seed: 43
sys_prompt_name: "instruct_tabc"
temperature: 0.7
use_vllm: true
vllm_device: auto
vllm_gpu_memory_utilization: 0.4
warmup_ratio: 0.05

# STPO-specific options
answer_stop_str: "</answer>"
confidence_stop_str: "</confidence>"
apply_answer_loss_on_first_confidence_only: false
